# noctalia-greeter sync.toml (UI + Sync; not managed by Nix)
# [session] last, [session.power] suspend/reboot/shutdown, [[session.actions]] action/command/label/glyph
# [appearance] scheme, theme_mode, corner_radius_scale, font_family
# [appearance.palette] full color role table, [appearance.wallpaper]/[appearance.wallpapers.<connector>]
# [output] layout/transforms/scales

[appearance]
corner_radius_scale = 1.0
scheme = "Synced"
theme_mode = "dark"

    [appearance.palette]
    error = "#FFB4AB"
    hover = "#F5B2E4"
    on_error = "#690005"
    on_hover = "#4E1E47"
    on_primary = "#302860"
    on_secondary = "#312E44"
    on_surface = "#E5E1E7"
    on_surface_variant = "#C9C4D0"
    on_tertiary = "#4E1E47"
    outline = "#48454F"
    primary = "#C9BFFF"
    secondary = "#C9C3E0"
    shadow = "#000000"
    surface = "#141317"
    surface_variant = "#201F23"
    tertiary = "#F5B2E4"

    [appearance.wallpaper]
    fill_mode = "crop"
    path = "/usr/share/wallpapers/convergence.png"

[output]
layout = "DP-1:0,0; DP-2:3440,0"

[[session.actions]]
action = "lock"

[[session.actions]]
action = "logout"

[[session.actions]]
action = "suspend"

[[session.actions]]
action = "reboot"

[[session.actions]]
action = "shutdown"

[[session.actions]]
action = "command"
command = "systemctl reboot --firmware-setup"
glyph = "artboard"
label = "UEFI"

[[session.actions]]
action = "command"
command = "killall mango"
glyph = "terminal-2"
label = "TTY"
